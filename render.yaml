# Render blueprint: New > Blueprint > pick this repository.
# The database lives on Neon, because free Render Postgres expires after 30 days.
services:
  - type: web
    name: sport-connect
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn sportconnect.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      # Postgres connection string from Neon (free, does not expire),
      # e.g. postgresql://user:pass@ep-xxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
