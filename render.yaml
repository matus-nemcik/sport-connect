# Render blueprint: New + > Blueprint > pick this repository.
services:
  - type: web
    name: sport-connect
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn sportconnect.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sport-connect-db
          property: connectionString

databases:
  - name: sport-connect-db
    plan: free
